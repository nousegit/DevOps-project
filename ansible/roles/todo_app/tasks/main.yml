---
- name: Install Java runtime
  ansible.builtin.package:
    name: openjdk-17-jre-headless
    state: present

- name: Create application account
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin

- name: Create application directory
  ansible.builtin.file:
    path: /opt/todo
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0755'

- name: Copy application jar
  ansible.builtin.copy:
    src: "{{ app_jar_source }}"
    dest: "{{ app_jar_destination }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0644'
  notify: Restart todo app

- name: Install systemd service
  ansible.builtin.template:
    src: todo-app.service.j2
    dest: /etc/systemd/system/todo-app.service
    mode: '0644'
  notify: Restart todo app

- name: Ensure Todo app is enabled and running
  ansible.builtin.systemd:
    name: todo-app
    enabled: true
    state: started
    daemon_reload: true
